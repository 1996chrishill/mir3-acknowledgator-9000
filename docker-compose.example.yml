services:
  mir3-acknowledgator-9000:
    image: YOUR_DOCKERHUB_USER/mir3-acknowledgator-9000:latest
    container_name: mir3-acknowledgator-9000
    restart: unless-stopped
    ports:
      - "${API_PORT:-8080}:${API_PORT:-8080}"
    environment:
      MIR3_USERNAME: ${MIR3_USERNAME}
      MIR3_PASSWORD: ${MIR3_PASSWORD}
      MIR3_BASE_URL: ${MIR3_BASE_URL}
      API_PORT: ${API_PORT:-8080}
      DRY_RUN: ${DRY_RUN:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TZ: ${TZ:-America/New_York}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      AUTO_ACK_INTERVAL_S: ${AUTO_ACK_INTERVAL_S:-240}
      AUTO_ACK_MAX_DURATION_S: ${AUTO_ACK_MAX_DURATION_S:-900}   # auto-ack stops itself after this; 0 = no limit
    volumes:
      - mir3-data:/data   # session cookies + history.json
    shm_size: "256mb"

volumes:
  mir3-data:
